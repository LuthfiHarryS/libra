<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.ico harus tetap ada di root: perayap favicon Google meminta
         /favicon.ico lebih dulu, dan tanpa berkasnya fallback SPA Nginx
         membalas index.html sehingga hasil pencarian memakai ikon globe. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1E4D6B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIBRA — Perpustakaan Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('libra-theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
