# Nginx site untuk LIBRA — /etc/nginx/sites-available/perpuslibra
#
# Satu origin untuk semuanya, supaya tidak ada mixed-content dan tidak butuh CORS:
#   /            -> build React statis (SPA fallback ke index.html)
#   /api/...     -> PHP-FPM (api/index.php sebagai front controller)
#   /uploads/... -> file statis (cover buku .webp, logo)
#   /chat        -> Flask chatbot di 127.0.0.1:5001
#
# Layanan CBF (5000) sengaja TIDAK di-proxy: hanya dipanggil PHP server-to-server.
#
# Blok SSL di bawah ditulis oleh Certbot. Jalankan dulu versi HTTP saja,
# baru `certbot --nginx -d perpuslibra.web.id -d www.perpuslibra.web.id`.

server {
    listen 80;
    listen [::]:80;
    server_name perpuslibra.web.id www.perpuslibra.web.id;

    root /var/www/libra/public;
    index index.html;

    # Cover buku rata-rata 20 KB dan tidak pernah berubah isinya sekali diunggah.
    # Nama file tetap sama saat cover diganti, jadi jangan pakai cache abadi.
    location /uploads/ {
        alias /var/www/libra/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Aset build Vite punya hash di nama file -> aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API PHP. Semua path /api/* masuk ke satu front controller.
    #
    # root di-set ulang di sini: direktori api/ berada SEJAJAR dengan public/,
    # bukan di dalamnya. Tanpa baris root ini Nginx mencari
    # /var/www/libra/public/api/index.php dan mengembalikan 404.
    location /api/ {
        root /var/www/libra;
        try_files $uri /api/index.php$is_args$args;
    }

    location = /api/index.php {
        root /var/www/libra;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
    }

    # Chatbot LinearSVC. Dipanggil langsung dari browser, jadi harus lewat Nginx
    # supaya tetap HTTPS dan satu origin.
    location /chat {
        proxy_pass http://127.0.0.1:5001/chat;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inferensi TF-IDF + LinearSVC cepat; timeout pendek supaya widget tidak menggantung
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # Jangan pernah sajikan config atau file PHP lain sebagai teks
    location ~ ^/api/(config\.(local|example)\.php|bootstrap\.php|debug\.php) {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }

    # SPA: semua route React (/katalog, /pinjaman, ...) dilayani index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 8M;      # cukup untuk upload cover/logo

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
